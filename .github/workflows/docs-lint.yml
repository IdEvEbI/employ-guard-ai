name: docs-lint

on:
  pull_request:
    paths:
      - "**.md"
      - ".prettierrc"
      - ".markdownlint.yaml"
      - "package.json"
      - "package-lock.json"
      - ".github/**"
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".prettierrc"
      - ".markdownlint.yaml"
      - "package.json"
      - "package-lock.json"
      - ".github/**"

concurrency:
  group: docs-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: format + markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: Markdownlint
        run: npm run lint:md
